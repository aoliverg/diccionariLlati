llm.remote.err.body.ca = <h4>No s'ha pogut connectar amb el servidor remot d'Ollama</h4><p>El diccionari i l'anàlisi morfosintàctica funcionen amb normalitat sense Ollama. Si vols fer servir un servidor remot, revisa l'adreça <code>{0}</code> a <code>config.yaml</code>.</p><p style='color: #6c757d; font-size: 12px;'>Detall tècnic: {1}</p>
llm.remote.err.body.es = <h4>No se pudo conectar con el servidor remoto de Ollama</h4><p>El diccionario y el análisis morfosintáctico funcionan con normalidad sin Ollama. Revisa la dirección <code>{0}</code> en <code>config.yaml</code>.</p><p style='color: #6c757d; font-size: 12px;'>Detalle técnico: {1}</p>
llm.remote.err.body.en = <h4>Could not connect to the remote Ollama server</h4><p>The dictionary and morphosyntactic analysis work normally without Ollama. Check the address <code>{0}</code> in <code>config.yaml</code>.</p><p style='color: #6c757d; font-size: 12px;'>Technical detail: {1}</p>
llm.remote.err.body.fr = <h4>Impossible de se connecter au serveur Ollama distant</h4><p>Le dictionnaire et l'analyse fonctionnent normalement sans Ollama. Vérifiez l'adresse <code>{0}</code> dans <code>config.yaml</code>.</p><p style='color: #6c757d; font-size: 12px;'>Détail technique : {1}</p>
llm.remote.err.body.la = <h4>Coniunctio cum servo Ollama remoto defecit</h4><p>Lexicon et analysis sine Ollama recte operantur. Inspice inscriptionem <code>{0}</code> in <code>config.yaml</code>.</p><p style='color: #6c757d; font-size: 12px;'>Singula: {1}</p>

llm.notinstalled.banner.ca = <b>Ollama no detectat al sistema ({0}).</b> El diccionari funciona amb normalitat; segueix les instruccions inferiors si vols activar la IA.
llm.notinstalled.banner.es = <b>Ollama no detectado en el sistema ({0}).</b> El diccionario funciona con normalidad; sigue las instrucciones inferiores si deseas activar la IA.
llm.notinstalled.banner.en = <b>Ollama not detected on system ({0}).</b> The dictionary works normally; follow the instructions below to enable AI translation.
llm.notinstalled.banner.fr = <b>Ollama non détecté sur le système ({0}).</b> Le dictionnaire fonctionne normalement ; suivez les instructions ci-dessous pour activer l'IA.
llm.notinstalled.banner.la = <b>Ollama in systemate ({0}) non inventum est.</b> Lexicon recte operatur; sequere praecepta infra si vis AI excitare.

llm.notinstalled.body.ca = <h4>Com instal·lar Ollama a {0} (Opcional)</h4><p>Totes les funcions de consulta lèxica, flexió, Lewis &amp; Short i anàlisi amb LatinCy funcionen sense Ollama. Per activar la traducció assistida per IA en local:</p><ol>{1}</ol><p>Un cop instal·lat i en marxa, fes clic a <b>«↻ Tornar a comprovar»</b> (el programa descarregarà sol el model <code>{2}</code> la primera vegada que tradueixis).</p>
llm.notinstalled.body.es = <h4>Cómo instalar Ollama en {0} (Opcional)</h4><p>Todas las funciones de consulta léxica, flexión, Lewis &amp; Short y análisis con LatinCy funcionan sin Ollama. Para activar la traducción asistida por IA en local:</p><ol>{1}</ol><p>Una vez instalado y en marcha, haz clic en <b>«↻ Volver a comprobar»</b> (el programa descargará solo el modelo <code>{2}</code> la primera vez que traduzcas).</p>
llm.notinstalled.body.en = <h4>How to install Ollama on {0} (Optional)</h4><p>All dictionary lookups, inflection tables, Lewis &amp; Short, and LatinCy sentence analysis work without Ollama. To enable local AI-assisted translation:</p><ol>{1}</ol><p>Once installed and running, click <b>"↻ Re-check status"</b> (the app will automatically pull <code>{2}</code> on your first translation).</p>
llm.notinstalled.body.fr = <h4>Comment installer Ollama sur {0} (Optionnel)</h4><p>Toutes les fonctions du dictionnaire, flexion, Lewis &amp; Short et LatinCy fonctionnent sans Ollama. Pour activer la traduction IA locale :</p><ol>{1}</ol><p>Une fois installé et lancé, cliquez sur <b>« ↻ Vérifier à nouveau »</b> (le modèle <code>{2}</code> sera téléchargé automatiquement).</p>
llm.notinstalled.body.la = <h4>Quomodo Ollama in {0} instituatur (Ad libitum)</h4><p>Omnia munera lexici, flexionis, Lewis &amp; Short et LatinCy sine Ollama operantur. Ad interpretationem AI excitandam:</p><ol>{1}</ol><p>Post institutionem preme <b>«↻ Iterum proba»</b> (exemplar <code>{2}</code> sponte deducetur).</p>

llm.stopped.banner.ca = <b>Ollama està instal·lat però el servei està aturat.</b>
llm.stopped.banner.es = <b>Ollama está instalado pero el servicio está detenido.</b>
llm.stopped.banner.en = <b>Ollama is installed, but the background service is stopped.</b>
llm.stopped.banner.fr = <b>Ollama est installé mais le service est arrêté.</b>
llm.stopped.banner.la = <b>Ollama institutum est sed ministerium quiescit.</b>

llm.stopped.body.ca = <h4>Servei Ollama aturat</h4><p>S'ha detectat Ollama instal·lat al sistema, però el servidor local no respon.</p><p>Obre l'aplicació <b>Ollama</b> o executa <code>ollama serve</code> en un terminal, i després prem <b>«↻ Tornar a comprovar»</b>.</p>
llm.stopped.body.es = <h4>Servicio Ollama detenido</h4><p>Se ha detectado Ollama instalado en el sistema, pero el servidor local no responde.</p><p>Abre la aplicación <b>Ollama</b> o ejecuta <code>ollama serve</code> en una terminal, y luego pulsa <b>«↻ Volver a comprobar»</b>.</p>
llm.stopped.body.en = <h4>Ollama service stopped</h4><p>Ollama is installed on your system, but the local server is not responding.</p><p>Launch the <b>Ollama</b> app or run <code>ollama serve</code> in a terminal, then click <b>"↻ Re-check status"</b>.</p>
llm.stopped.body.fr = <h4>Service Ollama arrêté</h4><p>Ollama est installé sur le système, mais le serveur local ne répond pas.</p><p>Ouvrez l'application <b>Ollama</b> ou exécutez <code>ollama serve</code> dans un terminal, puis cliquez sur <b>« ↻ Vérifier à nouveau »</b>.</p>
llm.stopped.body.la = <h4>Ministerium Ollama quiescit</h4><p>Ollama inventum est sed non respondet. Aperi <b>Ollama</b> vel exsequere <code>ollama serve</code>, deinde preme <b>«↻ Iterum proba»</b>.</p>

