spacy:
  model: "la_core_web_lg"  # Opcions: la_core_web_sm, la_core_web_md, la_core_web_lg, la_core_web_trf
  auto_install: true       # Si no està instal·lat, el descarrega i instal·la automàticament

traduccio_llm:
  actiu: true
  # URL d'Ollama. Si apunta a localhost o 127.0.0.1, es tracta com a local (permet auto_pull).
  # Si apunta a una IP externa (ex: "http://192.168.1.50:11434"), es tracta com a servidor remot.
  url: "http://localhost:11434"
  model: "qwen3.8:27b-mlx"      # Qualsevol model instal·lat o disponible a Ollama
  auto_pull: true          # Si és local i l'usuari no té el model, el descarrega automàticament
  thinking: false          # true = activa el raonament intern (més lent); false = resposta directa (molt més ràpid)
  llengua_desti: "català"  # Llengua a la qual es traduiran les glosses lèxiques (ex: català, castellà, francès...)
  max_tokens: 1500
  temperature: 0.1

  # Prompt auxiliar ràpid per traduir la glossa d'un mot a la pestanya d'Informació Morfològica
  prompt_glossa: |
    You are an expert classical lexicographer.
    Provide the concise, standard lexical equivalents in {llengua} for the following Latin word, using its category and English gloss as reference.
    Respond ONLY with the direct equivalents in {llengua} separated by commas or semicolons (no greetings, no explanations, no Latin repetition).

    Latin lemma: {lema}
    Part of speech: {categoria}
    English gloss: {glossa_en}

  # Text que substituirà {bloc_analisi} només quan l'usuari marqui la casella d'injectar l'anàlisi
  plantilla_analisi: |
    To help you avoid errors in agreement, grammatical cases, or verb tenses, use the following preliminary morphosyntactic analysis generated by LatinCy (Universal Dependencies) as your grammatical reference guide:
    {taula_analisi}

  # Prompt principal per a la traducció i anàlisi d'oracions
  prompt: |
    You are an expert classical philologist specializing in Latin and Catalan.
    Analyze and translate the following Latin sentence into natural, standard Catalan (català normatiu).
    Respond directly with no greetings, filler, or introductory remarks. Write the entire output in Catalan, following this exact, concise, and rigorous structure:

    1. Traducció al català: (a natural and faithful translation into Catalan).
    2. Anàlisi morfosintàctica: (word-by-word or by syntactic phrase, indicating lemma, part of speech, case/tense/mood, and syntactic function in Catalan).
    3. Explicació sintàctica i lèxica: (brief explanation of relevant syntax, constructions, or word meanings, only if necessary).

    {bloc_analisi}
    Latin sentence: "{text}"
